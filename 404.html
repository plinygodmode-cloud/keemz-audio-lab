<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <title>Page not found — Keemz Audio Lab</title>
  <meta name="description" content="That page is not in the lab. Head back to the studio.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/pages.css">
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="stage-glow stage-glow--warm"></div>
    <div class="stage-glow stage-glow--cool"></div>
    <div class="stage-grain"></div>
  </div>

  <div class="page-shell">
    <header class="page-header">
      <div class="page-header-inner">
        <a class="brand" href="/" aria-label="Keemz Audio Lab — home">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-type"><b>KEEMZ</b><i>audio lab</i></span>
        </a>
        <a class="text-link" href="/">Back to the lab <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <main class="page-main">
      <section class="page-card" aria-labelledby="notfound-title">
        <div class="page-mark is-warn" aria-hidden="true">404</div>
        <p class="eyebrow">Error 404</p>
        <h1 id="notfound-title">Nothing at this <em>frequency.</em></h1>
        <p>The page you asked for is not here. It may have moved, or the link may be incomplete.</p>
        <div class="page-actions">
          <a class="button button-primary" href="/">Home <span aria-hidden="true">↗</span></a>
          <a class="button" href="/#store">Sample store <span aria-hidden="true">↗</span></a>
          <a class="button" href="/#contact">Contact <span aria-hidden="true">↗</span></a>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <div class="page-footer-inner">
        <p class="mono footer-copy mono" id="copyright">© Keemz Audio Lab</p>
        <nav class="page-footer-links" aria-label="Footer">
          <a href="/#listen">Listen</a>
          <a href="/#store">Store</a>
          <a href="/licensing">Licensing</a>
          <a href="/#contact">Contact</a>
        </nav>
      </div>
    </footer>
  </div>
  <script defer src="/assets/pages.js"></script>
</body>
</html>
